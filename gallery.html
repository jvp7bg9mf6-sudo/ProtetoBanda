<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lumen · A 3D Minimalist Gallery</title>
<style>
  :root{
    --fg:#eef1f7;
    --muted:#9aa3b8;
    --accent:#8b9dff;
    --glass:rgba(20,24,40,0.45);
    --glass-border:rgba(255,255,255,0.12);
    --font:'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;}
  body{
    font-family:var(--font);
    color:var(--fg);
    background:#070912;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
  }
  body.dragging{cursor:grabbing;}

  /* ── Lively dark gradient background ── */
  #bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 18% 22%, rgba(70,60,150,0.55), transparent 45%),
      radial-gradient(circle at 82% 28%, rgba(20,90,140,0.5), transparent 48%),
      radial-gradient(circle at 50% 88%, rgba(120,40,110,0.45), transparent 52%),
      linear-gradient(135deg,#0a0c1a 0%,#0c1024 45%,#070912 100%);
    background-size:200% 200%;
    animation:drift 22s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{background-position:0% 0%, 100% 0%, 50% 100%, 0% 0%;}
    33%{background-position:30% 20%, 70% 30%, 40% 70%, 0% 0%;}
    66%{background-position:60% 10%, 40% 60%, 60% 90%, 0% 0%;}
  }
  /* soft grain / glow particles */
  #bg::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.55) 100%);
  }

  #scene{position:fixed;inset:0;z-index:1;display:block;}

  /* ── Loading prompt ── */
  #loader{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;
    background:rgba(7,9,18,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:opacity .8s ease, visibility .8s ease;
  }
  #loader.hide{opacity:0;visibility:hidden;}
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.12);
    border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader .txt{
    font-size:14px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--muted);
  }

  /* ── Shared glass UI ── */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 8px 40px rgba(0,0,0,0.4);
  }

  /* Title */
  #brand{
    position:fixed;top:28px;left:50%;transform:translateX(-50%);
    z-index:10;text-align:center;pointer-events:none;
    opacity:0;transition:opacity 1s ease .3s;
  }
  #brand .name{font-size:20px;letter-spacing:.5em;font-weight:300;text-transform:uppercase;}
  #brand .sub{margin-top:6px;font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;}

  /* ── Bottom-center info hint ── */
  #hint{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    z-index:10;
    padding:12px 22px;border-radius:999px;
    font-size:12.5px;letter-spacing:.04em;color:var(--fg);
    display:flex;align-items:center;gap:10px;
    opacity:0;transition:opacity 1s ease .5s;
  }
  #hint .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  #hint b{font-weight:600;color:var(--accent);}

  /* ── Auto-rotate button (lower right) ── */
  #autoBtn{
    position:fixed;bottom:26px;right:26px;z-index:10;
    display:flex;align-items:center;gap:9px;
    padding:11px 18px;border-radius:999px;cursor:pointer;
    color:var(--fg);font-size:12.5px;letter-spacing:.06em;
    transition:transform .2s ease, background .3s ease, border-color .3s ease;
    opacity:0;
  }
  #autoBtn.show{opacity:1;}
  #autoBtn:hover{transform:translateY(-2px);}
  #autoBtn .ico{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--muted);border-top-color:transparent;
    transition:border-color .3s ease;
  }
  #autoBtn.on .ico{border-color:var(--accent);border-top-color:transparent;animation:spin 2.2s linear infinite;}
  #autoBtn.on{border-color:rgba(139,157,255,0.5);}

  /* ── Detail card modal ── */
  #modal{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(5,7,15,0.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transition:opacity .4s ease, visibility .4s ease;
  }
  #modal.open{opacity:1;visibility:visible;}
  #card{
    width:min(860px,94vw);max-height:88vh;overflow:hidden;
    border-radius:18px;display:flex;
    transform:scale(.94) translateY(12px);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
  }
  #modal.open #card{transform:scale(1) translateY(0);}
  #card .media{
    flex:1 1 52%;min-width:0;background:#0a0c18;position:relative;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  #card .media img{width:100%;height:100%;object-fit:cover;display:block;}
  #card .info{
    flex:1 1 48%;padding:38px 34px;display:flex;flex-direction:column;gap:16px;
    overflow-y:auto;
  }
  #card .meta{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);}
  #card h2{font-size:27px;font-weight:300;line-height:1.2;letter-spacing:.01em;}
  #card .artist{font-size:13px;color:var(--muted);font-style:italic;}
  #card .desc{font-size:14.5px;line-height:1.7;color:#d4d9e6;}
  #card .swatch{display:flex;gap:8px;margin-top:auto;padding-top:10px;}
  #card .swatch span{width:26px;height:26px;border-radius:6px;border:1px solid var(--glass-border);}
  #closeBtn{
    position:absolute;top:14px;right:14px;z-index:2;
    width:36px;height:36px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--fg);font-size:18px;line-height:1;
    transition:transform .2s ease, background .3s ease;
  }
  #closeBtn:hover{transform:rotate(90deg);}

  @media (max-width:680px){
    #card{flex-direction:column;max-height:90vh;overflow-y:auto;}
    #card .media{min-height:230px;flex:none;}
    #brand .name{font-size:16px;letter-spacing:.35em;}
    #hint{font-size:11px;padding:10px 16px;}
    #hint .full{display:none;}
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="scene"></canvas>

  <!-- Loading prompt -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="txt">Loading gallery...</div>
  </div>

  <!-- Title -->
  <div id="brand">
    <div class="name">Lumen</div>
    <div class="sub">A Minimalist Gallery in Space</div>
  </div>

  <!-- Bottom-center info hint -->
  <div id="hint" class="glass">
    <span class="dot"></span>
    <span><b>Drag</b> to rotate the gallery<span class="full"> · </span></span>
    <span class="full"><b>Click</b> a painting to enlarge</span>
  </div>

  <!-- Auto-rotate toggle -->
  <button id="autoBtn" class="glass on">
    <span class="ico"></span>
    <span>Auto-rotate</span>
  </button>

  <!-- Detail card modal -->
  <div id="modal">
    <div id="card" class="glass">
      <div class="media">
        <div id="closeBtn" class="glass">×</div>
        <img id="cardImg" alt=""/>
      </div>
      <div class="info">
        <div class="meta" id="cardMeta">Oil on canvas</div>
        <h2 id="cardTitle">Title</h2>
        <div class="artist" id="cardArtist">Artist</div>
        <div class="desc" id="cardDesc">Description</div>
        <div class="swatch" id="cardSwatch"></div>
      </div>
    </div>
  </div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ───────────────────────── Gallery data ───────────────────────── */
const ARTWORKS = [
  { title:'Crimson Drift',   artist:'Ana Vasquez',  year:'2021', medium:'Acrylic on linen',
    colors:['#e23744','#2b1418','#f0c1a0'],
    desc:'A single ribbon of crimson cuts across a dusk-toned field, exploring how one bold gesture can hold an entire silence together.' },
  { title:'Quiet Meridian',  artist:'Yusuke Tanabe', year:'2019', medium:'Oil on canvas',
    colors:['#2f6f8f','#0e2330','#cfe4ec'],
    desc:'Horizontal bands of blue dissolve into mist. The work meditates on the meridian — the line where the sea forgets where it ends.' },
  { title:'Solar Index',     artist:'Mira Okonkwo', year:'2022', medium:'Pigment & gold leaf',
    colors:['#f4a72c','#7a3b0c','#fde7b0'],
    desc:'Concentric arcs of warm ochre radiate from an unseen sun, indexing light not as illumination but as a slow, patient weight.' },
  { title:'Verdant Static',  artist:'Léo Marchand', year:'2020', medium:'Mixed media',
    colors:['#3f8a4d','#10241a','#bfe6c2'],
    desc:'Layers of green flicker like signal through foliage — a portrait of growth caught mid-transmission, alive and unresolved.' },
  { title:'Lilac Interval',  artist:'Sofia Bellini', year:'2023', medium:'Soft pastel',
    colors:['#9b7bd4','#241a3a','#e8def7'],
    desc:'Two fields of violet pause against one another. The interval between them — barely a breath — is the real subject of the piece.' },
  { title:'Ember Field',     artist:'Noah Halvorsen', year:'2018', medium:'Encaustic wax',
    colors:['#d65a2e','#2a120a','#f6cba0'],
    desc:'Beneath translucent wax, embers seem to cool and rekindle. A study of heat as memory, fading yet never quite extinguished.' },
  { title:'Northern Cipher', artist:'Elin Sandberg', year:'2021', medium:'Indigo on paper',
    colors:['#27496d','#0a1622','#9fc0d8'],
    desc:'Pale marks scatter across deep indigo like a code half-remembered. A northern night written in a language of distance.' },
  { title:'Bloom Theorem',   artist:'Priya Raman',   year:'2022', medium:'Watercolour',
    colors:['#e06aa0','#2c1422','#f7d4e6'],
    desc:'Petals open according to a logic of their own — soft, recursive, inevitable. Beauty proposed not as accident but as proof.' },
];

/* Build a clean minimalist canvas texture for each artwork (no external images needed) */
function makeArtTexture(art){
  const S=1024, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  const [a,b,cc]=art.colors;
  // backdrop wash
  const g=x.createLinearGradient(0,0,S,S);
  g.addColorStop(0,b); g.addColorStop(1,shade(b,18));
  x.fillStyle=g; x.fillRect(0,0,S,S);

  // deterministic pseudo-random from title
  let seed=0; for(const ch of art.title) seed=(seed*31+ch.charCodeAt(0))%9973;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };

  // large soft form
  x.save();
  const grd=x.createRadialGradient(S*(.3+rnd()*.4),S*(.3+rnd()*.4),40,S*.5,S*.5,S*.7);
  grd.addColorStop(0,a); grd.addColorStop(1,'rgba(0,0,0,0)');
  x.globalAlpha=.85; x.fillStyle=grd; x.fillRect(0,0,S,S);
  x.restore();

  // a few minimalist bands / arcs
  const mode=Math.floor(rnd()*3);
  x.globalAlpha=.9;
  if(mode===0){ // bands
    for(let i=0;i<3;i++){ x.fillStyle=i%2?a:cc; const h=S*(.06+rnd()*.12); x.fillRect(0,S*(.2+i*.22),S,h); }
  } else if(mode===1){ // arcs
    for(let i=0;i<3;i++){ x.strokeStyle=i?cc:a; x.lineWidth=18+rnd()*30; x.beginPath();
      x.arc(S*.5,S*.95,S*(.25+i*.22),Math.PI,0); x.stroke(); }
  } else { // single ribbon + dot
    x.strokeStyle=a; x.lineWidth=46; x.lineCap='round'; x.beginPath();
    x.moveTo(S*.12,S*.78); x.bezierCurveTo(S*.4,S*.2,S*.6,S*.9,S*.9,S*.25); x.stroke();
    x.fillStyle=cc; x.beginPath(); x.arc(S*(.25+rnd()*.5),S*(.25+rnd()*.5),34,0,7); x.fill();
  }
  // subtle vignette
  const vg=x.createRadialGradient(S*.5,S*.5,S*.3,S*.5,S*.5,S*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)');
  x.globalAlpha=1; x.fillStyle=vg; x.fillRect(0,0,S,S);

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  art._dataURL=c.toDataURL('image/jpeg',0.9);
  return t;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

/* ───────────────────────── Three.js scene ───────────────────────── */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0.4,7.2);

// lights
scene.add(new THREE.AmbientLight(0xb9c4ff,0.8));
const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,6,8); scene.add(key);
const rim=new THREE.PointLight(0x8b9dff,1.6,30); rim.position.set(-6,2,-4); scene.add(rim);
const warm=new THREE.PointLight(0xff8bb0,1.1,30); warm.position.set(6,-2,2); scene.add(warm);

// floating dust particles for liveliness
(function dust(){
  const N=260, geo=new THREE.BufferGeometry(), pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*22; pos[i*3+1]=(Math.random()-.5)*14; pos[i*3+2]=(Math.random()-.5)*22; }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0x9aa7ff,size:0.035,transparent:true,opacity:0.55,depthWrite:false});
  const p=new THREE.Points(geo,mat); p.name='dust'; scene.add(p);
})();

// Gallery ring of framed paintings
const ring=new THREE.Group(); scene.add(ring);
const R=4.6, frames=[];
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();

ARTWORKS.forEach((art,i)=>{
  const a=(i/ARTWORKS.length)*Math.PI*2;
  const g=new THREE.Group();
  g.position.set(Math.sin(a)*R,0,Math.cos(a)*R);
  g.lookAt(0,0,0); g.rotateY(Math.PI); // face outward toward viewer when in front

  // frame
  const fw=2.0, fh=2.5, d=0.12;
  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(fw+0.22,fh+0.22,d),
    new THREE.MeshStandardMaterial({color:0x111522,metalness:0.4,roughness:0.5})
  );
  g.add(frame);
  // mat board
  const mat=new THREE.Mesh(new THREE.PlaneGeometry(fw+0.02,fh+0.02),
    new THREE.MeshStandardMaterial({color:0x0c0f1a,roughness:0.9}));
  mat.position.z=d/2+0.001; g.add(mat);
  // canvas
  const tex=makeArtTexture(art);
  const canvasMesh=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),
    new THREE.MeshStandardMaterial({map:tex,roughness:0.85,metalness:0.0}));
  canvasMesh.position.z=d/2+0.01;
  canvasMesh.userData.index=i;
  g.add(canvasMesh);
  frames.push(canvasMesh);

  // little glowing spotlight pedestal under each
  const glow=new THREE.Mesh(new THREE.CircleGeometry(1.1,32),
    new THREE.MeshBasicMaterial({color:new THREE.Color(art.colors[0]),transparent:true,opacity:0.12}));
  glow.rotation.x=-Math.PI/2; glow.position.y=-1.7; g.add(glow);

  ring.add(g);
});

/* ───────────────────────── Interaction ───────────────────────── */
let autoRotate=true, targetRotY=0, curRotY=0, velY=0;
let dragging=false, lastX=0, lastY=0, tilt=0, targetTilt=0;
let movedDist=0, downX=0, downY=0;

const autoBtn=document.getElementById('autoBtn');
autoBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  autoRotate=!autoRotate;
  autoBtn.classList.toggle('on',autoRotate);
});

function pointerDown(e){
  if(document.getElementById('modal').classList.contains('open')) return;
  dragging=true; movedDist=0;
  const p=evt(e); lastX=downX=p.x; lastY=downY=p.y;
  document.body.classList.add('dragging');
}
function pointerMove(e){
  if(!dragging) return;
  const p=evt(e);
  const dx=p.x-lastX, dy=p.y-lastY;
  movedDist+=Math.abs(dx)+Math.abs(dy);
  velY=dx*0.006;
  targetRotY+=velY;
  targetTilt=Math.max(-0.5,Math.min(0.5,targetTilt - dy*0.004));
  lastX=p.x; lastY=p.y;
}
function pointerUp(e){
  if(!dragging) return;
  dragging=false;
  document.body.classList.remove('dragging');
  // treat as click if barely moved
  if(movedDist<6){ tryPick(downX,downY); }
}
function evt(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }

canvas.addEventListener('mousedown',pointerDown);
window.addEventListener('mousemove',pointerMove);
window.addEventListener('mouseup',pointerUp);
canvas.addEventListener('touchstart',pointerDown,{passive:true});
window.addEventListener('touchmove',pointerMove,{passive:true});
window.addEventListener('touchend',pointerUp);

function tryPick(px,py){
  pointer.x=(px/innerWidth)*2-1;
  pointer.y=-(py/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(frames,false);
  if(hits.length){ openCard(hits[0].object.userData.index); }
}

/* ───────────────────────── Modal card ───────────────────────── */
const modal=document.getElementById('modal');
function openCard(i){
  const art=ARTWORKS[i];
  document.getElementById('cardImg').src=art._dataURL;
  document.getElementById('cardTitle').textContent=art.title;
  document.getElementById('cardArtist').textContent=`${art.artist} · ${art.year}`;
  document.getElementById('cardMeta').textContent=art.medium;
  document.getElementById('cardDesc').textContent=art.desc;
  const sw=document.getElementById('cardSwatch'); sw.innerHTML='';
  art.colors.forEach(col=>{ const s=document.createElement('span'); s.style.background=col; sw.appendChild(s); });
  modal.classList.add('open');
}
function closeCard(){ modal.classList.remove('open'); }
document.getElementById('closeBtn').addEventListener('click',closeCard);
modal.addEventListener('click',(e)=>{ if(e.target===modal) closeCard(); });
window.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeCard(); });

/* ───────────────────────── Resize & render loop ───────────────────────── */
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();

  if(autoRotate && !dragging){ targetRotY+=0.0026; }
  // inertia / smoothing
  curRotY+=(targetRotY-curRotY)*0.08;
  tilt+=(targetTilt-tilt)*0.08;
  if(!dragging){ targetTilt*=0.96; }
  ring.rotation.y=curRotY;
  ring.rotation.x=tilt*0.4;
  ring.position.y=Math.sin(t*0.6)*0.12;

  const dustObj=scene.getObjectByName('dust');
  if(dustObj){ dustObj.rotation.y=t*0.02; dustObj.rotation.x=Math.sin(t*0.1)*0.05; }

  rim.position.x=Math.sin(t*0.4)*6;
  warm.position.x=Math.cos(t*0.3)*6;

  renderer.render(scene,camera);
}
loop();

/* ───────────────────────── Loading sequence ───────────────────────── */
window.addEventListener('load',()=>{
  // small delay so the spinner reads as intentional
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    document.getElementById('brand').style.opacity=1;
    document.getElementById('hint').style.opacity=1;
    autoBtn.classList.add('show');
  },1100);
});
</script>
</body>
</html>
