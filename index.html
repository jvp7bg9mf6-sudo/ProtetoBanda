<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Livros são Portas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400&family=Lora:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#f5f0e8;--surface:#fdfaf5;--ink:#1c1408;--muted:#6b5c42;--faint:#a09070;
  --forest:#2b5016;--forest-mid:#3d6b18;--forest-light:#559a28;--forest-pale:#eaf2df;
  --border:#d8cdb8;--border-light:#e8e0d0;--red:#b71c1c;--red-pale:#fde8e8;
  --r:8px;--r-lg:12px;
  --fd:'Playfair Display',serif;--fb:'Lora',serif;--fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:var(--fb);font-size:14px;}
::placeholder{color:var(--faint);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade{animation:fadeUp .3s ease forwards;}
.hidden{display:none!important;}

/* ── Layout ── */
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:var(--cream);}
.center{text-align:center;max-width:360px;width:100%;}
.max{max-width:740px;margin:0 auto;padding:24px;}

/* ── Nav ── */
.nav{background:var(--surface);border-bottom:1px solid var(--border-light);padding:0 24px;position:sticky;top:0;z-index:100;}
.nav-top{max-width:740px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:10px;}
.nav-logo .dot{width:28px;height:28px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;}
.nav-tabs{max-width:740px;margin:0 auto;display:flex;}
.nav-tab{padding:10px 16px;background:none;border:none;cursor:pointer;font-size:13px;font-family:var(--fb);font-weight:400;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;}
.nav-tab.active{font-weight:600;color:var(--forest);border-bottom-color:var(--forest);}
.btn-sair{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;font-family:var(--fm);padding:6px 10px;border-radius:8px;}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:20px;box-shadow:0 2px 8px rgba(28,20,8,.08);}
.card-list{display:flex;flex-direction:column;gap:8px;}
.card-clickable{cursor:pointer;transition:box-shadow .15s;}
.card-clickable:hover{box-shadow:0 4px 20px rgba(28,20,8,.14);}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:16px 10px;text-align:center;box-shadow:0 2px 8px rgba(28,20,8,.08);}
.stat-num{font-family:var(--fd);font-size:26px;font-weight:800;color:var(--forest);line-height:1;}
.stat-label{font-size:10px;color:var(--muted);font-family:var(--fm);letter-spacing:.07em;text-transform:uppercase;margin-top:5px;}

/* ── Volunteer card ── */
.vol-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:14px 16px;box-shadow:0 2px 8px rgba(28,20,8,.08);cursor:pointer;transition:box-shadow .15s;}
.vol-card:hover{box-shadow:0 4px 20px rgba(28,20,8,.14);}
.vol-row{display:flex;align-items:center;gap:12px;}
.vol-info{flex:1;min-width:0;}
.vol-name{font-weight:600;font-size:14px;color:var(--ink);}
.vol-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.vol-sub{font-size:11px;color:var(--faint);font-family:var(--fm);}
.see-detail{font-size:11px;color:var(--forest-mid);font-family:var(--fm);font-weight:600;}
.vol-hrs{font-family:var(--fm);font-size:12px;flex-shrink:0;}

/* ── Progress bar ── */
.prog-wrap{width:100%;height:4px;background:var(--border-light);border-radius:99px;overflow:hidden;margin:6px 0;}
.prog-fill{height:100%;border-radius:99px;background:var(--forest);transition:width .6s;}
.prog-fill.done{background:var(--forest-light);}

/* ── Avatar ── */
.avatar{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--fd);}

/* ── Badge ── */
.badge{font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;font-family:var(--fm);}

/* ── Buttons ── */
.btn{padding:10px 20px;border-radius:var(--r);font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:var(--forest);color:#fff;}
.btn-primary:hover:not(:disabled){background:#3d6b18;}
.btn-secondary{background:transparent;color:var(--forest);border:1px solid var(--forest);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-danger{background:var(--red);color:#fff;}
.btn-full{width:100%;}
.btn-back{background:none;border:none;cursor:pointer;color:var(--muted);font-family:var(--fm);font-size:12px;letter-spacing:.05em;padding:4px 0;display:flex;align-items:center;gap:6px;margin-bottom:24px;}

/* ── Form ── */
.field{display:flex;flex-direction:column;gap:7px;}
.label{font-size:11px;font-family:var(--fm);font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;}
.input{width:100%;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:var(--r);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--forest);}
.input.err{border-color:var(--red);}
.input-select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='11' height='7' viewBox='0 0 11 7' fill='none'%3E%3Cpath d='M1 1l4.5 4.5L10 1' stroke='%236b5c42' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grade-btns{display:flex;gap:6px;flex-wrap:wrap;}
.grade-btn{flex:1 0 auto;padding:8px 4px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-family:var(--fm);transition:all .15s;}
.grade-btn.active{border-color:var(--forest);background:var(--forest);color:#fff;}
.grade-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.grade-filter-btn{padding:5px 13px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--fm);transition:all .15s;}
.grade-filter-btn.active{border-color:var(--forest);background:var(--forest);color:#fff;}

/* ── Alerts ── */
.alert{font-size:13px;padding:9px 14px;border-radius:var(--r);font-family:var(--fm);}
.alert-error{color:var(--red);background:var(--red-pale);}
.alert-success{color:var(--forest);background:var(--forest-pale);}

/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;z-index:500;background:rgba(28,20,8,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(28,20,8,.2);}
.modal-header{padding:20px 20px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:14px;flex-shrink:0;}
.modal-close{background:var(--cream);border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.modal-progress{padding:14px 20px;border-bottom:1px solid var(--border-light);flex-shrink:0;}
.modal-body{overflow-y:auto;padding:16px 20px 32px;flex:1;}
.session-row{padding:14px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.session-row:last-child{border-bottom:none;}
.session-activity{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:4px;}
.session-date{font-size:12px;color:var(--muted);font-family:var(--fm);}
.session-notes{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic;}
.session-hrs{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--forest);flex-shrink:0;}
.section-label{font-family:var(--fm);font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px;}
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-style:italic;}

/* ── Home page ── */
.home-bg-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);font-family:var(--fd);font-weight:800;font-size:clamp(160px,35vw,320px);color:var(--forest);opacity:.035;user-select:none;pointer-events:none;line-height:1;}
.home-icon{width:60px;height:60px;border-radius:50%;background:var(--forest);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(43,80,22,.35);}
.home-tag{font-family:var(--fm);font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;}
.home-title{font-family:var(--fd);font-size:clamp(30px,7vw,42px);font-weight:700;color:var(--ink);line-height:1.15;margin-bottom:20px;}
.home-sub{font-size:14px;color:var(--muted);margin-bottom:36px;font-style:italic;}
.home-btns{display:flex;flex-direction:column;gap:12px;}
.home-footer{margin-top:30px;color:var(--faint);font-size:11px;font-family:var(--fm);}

/* ── Profile ── */
.profile-header{background:var(--surface);border-bottom:1px solid var(--border-light);padding:16px 24px 0;}
.profile-hinner{max-width:560px;margin:0 auto;}
.profile-top{display:flex;align-items:flex-end;gap:14px;padding-bottom:20px;}
.profile-name{font-family:var(--fd);font-size:24px;font-weight:700;line-height:1.2;color:var(--ink);}
.profile-badges{display:flex;gap:10px;margin-top:6px;align-items:center;}
.profile-content{max-width:560px;margin:0 auto;padding:20px 24px 48px;}
.progress-ring-wrap{position:relative;flex-shrink:0;}
.progress-info{flex:1;min-width:150px;}
.prog-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.prog-stat-num{font-family:var(--fd);font-size:18px;font-weight:800;color:#3a2e1a;line-height:1;}
.prog-stat-label{font-size:9px;color:var(--muted);font-family:var(--fm);text-transform:uppercase;margin-top:2px;}

/* ── Del btn ── */
.del-btn{background:none;border:none;cursor:pointer;color:var(--faint);font-size:20px;line-height:1;padding:4px 8px;}
.del-btn:hover{color:var(--red);}

/* ── Search ── */
.search-results{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 8px rgba(28,20,8,.09);}
.search-item{width:100%;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;border-top:1px solid var(--border-light);background:none;cursor:pointer;text-align:left;}
.search-item:first-child{border-top:none;}
.search-item:hover{background:var(--forest-pale);}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════ -->
<!--  SCREENS                                         -->
<!-- ════════════════════════════════════════════════ -->

<!-- HOME -->
<div id="screen-home" class="screen">
  <div class="home-bg-num">50</div>
  <div class="center fade" style="position:relative;">
    <div class="home-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M6 4h9a3 3 0 013 3v14l-6-3.5L6 21V4z" fill="white" opacity=".95"/><path d="M12 4h6a2 2 0 012 2v16l-4.5-2.8L12 22V4z" fill="white" opacity=".45"/></svg>
    </div>
    <p class="home-tag">Registo de horas comunitárias</p>
    <h1 class="home-title">Livros são<br/><em style="color:var(--forest)">Portas</em></h1>
    <p class="home-sub">Meta: <strong style="color:#3a2e1a;font-style:normal">50 horas</strong> de leitura comunitária</p>
    <div class="home-btns">
      <button class="btn btn-primary btn-full" style="padding:14px;font-size:15px;" onclick="showCoordLogin()">Coordenador</button>
      <button class="btn btn-secondary btn-full" style="padding:14px;font-size:15px;" onclick="showVolLogin()">Ver o meu perfil</button>
    </div>
    <p class="home-footer">Dados partilhados em tempo real</p>
  </div>
</div>

<!-- COORD LOGIN -->
<div id="screen-coord-login" class="screen hidden">
  <div style="width:100%;max-width:380px;" class="fade">
    <button class="btn-back" onclick="showHome()">← Voltar</button>
    <h2 style="font-family:var(--fd);font-size:28px;font-weight:700;margin-bottom:6px;">Acesso Coordenador</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:24px;">Introduz o código de acesso.</p>
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label class="label">Código de acesso</label>
        <input id="coord-pass" type="password" class="input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doCoordLogin()"/>
      </div>
      <div id="coord-err" class="alert alert-error hidden"></div>
      <button class="btn btn-primary btn-full" style="padding:12px;" onclick="doCoordLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- VOL LOGIN -->
<div id="screen-vol-login" class="screen hidden">
  <div style="width:100%;max-width:420px;" class="fade">
    <button class="btn-back" onclick="showHome()">← Voltar</button>
    <h2 style="font-family:var(--fd);font-size:28px;font-weight:700;margin-bottom:20px;">O meu perfil</h2>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="field">
        <label class="label">Ano</label>
        <div class="grade-filter" id="vol-login-grade-filter">
          <button class="grade-filter-btn active" onclick="volLoginGrade('')">Todos</button>
          <button class="grade-filter-btn" onclick="volLoginGrade('10º Ano')">10º Ano</button>
          <button class="grade-filter-btn" onclick="volLoginGrade('11º Ano')">11º Ano</button>
          <button class="grade-filter-btn" onclick="volLoginGrade('12º Ano')">12º Ano</button>
        </div>
      </div>
      <div class="field">
        <label class="label">Nome</label>
        <input id="vol-search" type="text" class="input" placeholder="Pesquisa pelo teu nome..." oninput="renderVolSearch()"/>
      </div>
      <div id="vol-search-results"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="screen-dashboard" class="hidden">
  <div class="nav">
    <div class="nav-top">
      <div class="nav-logo">
        <div class="dot"><svg width="14" height="14" viewBox="0 0 28 28" fill="none"><path d="M6 4h9a3 3 0 013 3v14l-6-3.5L6 21V4z" fill="white" opacity=".95"/><path d="M12 4h6a2 2 0 012 2v16l-4.5-2.8L12 22V4z" fill="white" opacity=".45"/></svg></div>
        Livros são Portas
      </div>
      <button class="btn-sair" onclick="showHome()">Sair</button>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" id="tab-btn-overview" onclick="switchTab('overview')">Visão geral</button>
      <button class="nav-tab" id="tab-btn-log" onclick="switchTab('log')">Registar horas</button>
      <button class="nav-tab" id="tab-btn-members" onclick="switchTab('members')">Membros</button>
    </div>
  </div>
  <div class="max">
    <div id="tab-overview" class="fade"></div>
    <div id="tab-log" class="hidden"></div>
    <div id="tab-members" class="hidden"></div>
  </div>
</div>

<!-- PROFILE -->
<div id="screen-profile" class="hidden">
  <div class="profile-header">
    <div class="profile-hinner">
      <button class="btn-back" onclick="showHome()">← Voltar</button>
      <div class="profile-top" id="profile-top"></div>
    </div>
  </div>
  <div class="profile-content" id="profile-content"></div>
</div>

<!-- MODAL -->
<div id="detail-modal" class="modal-backdrop hidden" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header" id="modal-header"></div>
    <div class="modal-progress" id="modal-progress"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!--  JAVASCRIPT                                      -->
<!-- ════════════════════════════════════════════════ -->
<script>
/* ── Firebase ── */
firebase.initializeApp({
  apiKey:"AIzaSyBTmPVFSFtDvnBuXy-cx_ogB7XodqCogkM",
  authDomain:"biblioteca-comunitaria-a93f9.firebaseapp.com",
  projectId:"biblioteca-comunitaria-a93f9",
  storageBucket:"biblioteca-comunitaria-a93f9.firebasestorage.app",
  messagingSenderId:"603000168473",
  appId:"1:603000168473:web:514caec661c58d674dca88"
});
const db = firebase.firestore();

/* ── State ── */
const GOAL = 50;
const COORD_PASS = "livros2027";
const GRADE_COLORS = {"10º Ano":{bg:"#fff0d4",c:"#7a4f00"},"11º Ano":{bg:"#deeafc",c:"#1c3054"},"12º Ano":{bg:"#ead5fc",c:"#3b1060"}};
const AVATAR_COLORS = ["#2b5016","#7a3f10","#1c3054","#3b1060","#004d40","#4e342e"];
let volunteers = [], sessions = [], volLoginGradeFilter = "", currentProfile = null;
let unsubVols, unsubSess;

/* ── Helpers ── */
const genId = () => Math.random().toString(36).slice(2)+Date.now().toString(36);
const fmtDate = d => d ? new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{day:"2-digit",month:"short",year:"numeric"}) : "";
const show = id => document.getElementById(id).classList.remove("hidden");
const hide = id => document.getElementById(id).classList.add("hidden");
const $ = id => document.getElementById(id);

function avatarHtml(name, size=44){
  const init = name.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const c = AVATAR_COLORS[(name.charCodeAt(0)+(name.charCodeAt(1)||0))%AVATAR_COLORS.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${c};font-size:${Math.round(size*.36)}px;">${init}</div>`;
}

function badgeHtml(grade){
  const p = GRADE_COLORS[grade]||GRADE_COLORS["11º Ano"];
  return `<span class="badge" style="background:${p.bg};color:${p.c};">${grade}</span>`;
}

function progBar(pct){
  const w = Math.min(pct,100);
  const cls = w>=100?"done":"";
  return `<div class="prog-wrap"><div class="prog-fill ${cls}" style="width:${w}%"></div></div>`;
}

function volHours(vid){
  return sessions.filter(s=>s.volunteerId===vid).reduce((a,b)=>a+(b.hours||0),0);
}

/* ── Screens ── */
function showHome(){
  ["screen-home","screen-coord-login","screen-vol-login","screen-dashboard","screen-profile"].forEach(s=>{
    s==="screen-home" ? show(s) : hide(s);
  });
  if(unsubVols){unsubVols();unsubVols=null;}
  if(unsubSess){unsubSess();unsubSess=null;}
  volunteers=[]; sessions=[];
}

function showCoordLogin(){ hide("screen-home"); show("screen-coord-login"); $("coord-pass").value=""; hide("coord-err"); }
function showVolLogin(){ hide("screen-home"); show("screen-vol-login"); $("vol-search").value=""; $("vol-search-results").innerHTML=""; }

function doCoordLogin(){
  const p=$("coord-pass").value;
  if(p===COORD_PASS){ hide("screen-coord-login"); showDashboard(); }
  else { const el=$("coord-err"); el.textContent="Código incorrecto. Tenta de novo."; show("coord-err"); }
}

function showDashboard(){
  show("screen-dashboard");
  switchTab("overview");
  startFirebaseListeners();
}

function startFirebaseListeners(){
  unsubVols = db.collection("livros").doc("volunteers").onSnapshot(snap=>{
    volunteers = snap.exists ? (snap.data().items||[]) : [];
    renderCurrentTab();
  });
  unsubSess = db.collection("livros").doc("sessions").onSnapshot(snap=>{
    sessions = snap.exists ? (snap.data().items||[]) : [];
    renderCurrentTab();
  });
}

function saveVols(){ db.collection("livros").doc("volunteers").set({items:volunteers}); }
function saveSess(){ db.collection("livros").doc("sessions").set({items:sessions}); }

/* ── Dashboard tabs ── */
let currentTab = "overview";
function switchTab(tab){
  currentTab = tab;
  ["overview","log","members"].forEach(t=>{
    const btn=$("tab-btn-"+t), el=$("tab-"+t);
    if(t===tab){ btn.classList.add("active"); show("tab-"+t); }
    else{ btn.classList.remove("active"); hide("tab-"+t); }
  });
  renderCurrentTab();
}

function renderCurrentTab(){
  if(currentTab==="overview") renderOverview();
  else if(currentTab==="log") renderLog();
  else if(currentTab==="members") renderMembers();
}

/* ── OVERVIEW TAB ── */
let overviewGradeFilter = "";
function renderOverview(){
  const totalH = sessions.reduce((s,x)=>s+(x.hours||0),0);
  const filtered = overviewGradeFilter ? volunteers.filter(v=>v.grade===overviewGradeFilter) : volunteers;
  const withH = filtered.map(v=>({...v,hours:volHours(v.id),pct:Math.min((volHours(v.id)/GOAL)*100,100)})).sort((a,b)=>b.hours-a.hours);

  const gradeFilterHtml = ["","10º Ano","11º Ano","12º Ano"].map(g=>`
    <button class="grade-filter-btn${overviewGradeFilter===g?' active':''}" onclick="setOverviewGrade('${g}')">
      ${g||"Todos"}
    </button>`).join("");

  const cardsHtml = withH.length===0
    ? `<div class="card empty">Nenhum voluntário inscrito ainda.</div>`
    : withH.map(v=>`
      <div class="vol-card" onclick="openModal('${v.id}')">
        <div class="vol-row">
          ${avatarHtml(v.name,42)}
          <div class="vol-info">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;">
              <span class="vol-name">${v.name}</span>
              <span class="vol-hrs" style="color:${v.pct>=100?'var(--forest-light)':'var(--muted)'};">${v.hours}h / ${GOAL}h</span>
            </div>
            ${progBar(v.pct)}
            <div class="vol-meta">
              <div style="display:flex;align-items:center;gap:8px;">
                ${badgeHtml(v.grade)}
                <span class="vol-sub">${v.program||"—"}</span>
              </div>
              <span class="see-detail">Ver detalhes →</span>
            </div>
          </div>
        </div>
      </div>`).join("");

  $("tab-overview").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${volunteers.length}</div><div class="stat-label">Voluntários</div></div>
      <div class="stat-card"><div class="stat-num">${totalH}<span style="font-size:14px">h</span></div><div class="stat-label">Horas totais</div></div>
      <div class="stat-card"><div class="stat-num">${sessions.length}</div><div class="stat-label">Sessões</div></div>
    </div>
    <div class="grade-filter">${gradeFilterHtml}</div>
    <div class="card-list">${cardsHtml}</div>`;
}

function setOverviewGrade(g){ overviewGradeFilter=g; renderOverview(); }

/* ── DETAIL MODAL ── */
function openModal(vid){
  const v = volunteers.find(x=>x.id===vid); if(!v)return;
  const mine = sessions.filter(s=>s.volunteerId===vid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const hours = mine.reduce((a,b)=>a+(b.hours||0),0);
  const pct = Math.min((hours/GOAL)*100,100);

  $("modal-header").innerHTML=`
    ${avatarHtml(v.name,48)}
    <div style="flex:1;min-width:0;">
      <h3 style="font-family:var(--fd);font-size:20px;font-weight:700;color:var(--ink);line-height:1.2;">${v.name}</h3>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        ${badgeHtml(v.grade)}
        <span style="font-size:12px;color:var(--muted);font-family:var(--fm);">${v.program||"—"}</span>
      </div>
    </div>
    <button class="modal-close" onclick="$('detail-modal').classList.add('hidden')">×</button>`;

  $("modal-progress").innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <span style="font-size:13px;font-weight:600;color:var(--ink);">${hours}h completadas</span>
      <span style="font-size:13px;font-family:var(--fm);color:${pct>=100?'var(--forest-light)':'var(--muted)'};font-weight:${pct>=100?600:400};">${Math.round(pct)}% da meta</span>
    </div>
    ${progBar(pct)}`;

  const sessHtml = mine.length===0
    ? `<p class="empty">Nenhuma sessão registada ainda.</p>`
    : mine.map((s,i)=>`
      <div class="session-row">
        <div style="flex:1;">
          <div class="session-activity">${s.activity||"—"}</div>
          <div class="session-date">${fmtDate(s.date)}</div>
          ${s.notes?`<p class="session-notes">${s.notes}</p>`:""}
        </div>
        <span class="session-hrs">${s.hours}h</span>
      </div>`).join("");

  $("modal-body").innerHTML=`
    <p class="section-label">Historial de sessões (${mine.length})</p>
    ${sessHtml}`;

  show("detail-modal");
}

function closeModal(e){ if(e.target.id==="detail-modal") $("detail-modal").classList.add("hidden"); }

/* ── LOG HOURS TAB ── */
let logForm = { volunteerId:"", date:new Date().toISOString().split("T")[0], hours:"", activity:"", notes:"" };
function renderLog(){
  const options = ["10º Ano","11º Ano","12º Ano"].map(g=>`
    <optgroup label="${g}">
      ${volunteers.filter(v=>v.grade===g).sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`
        <option value="${v.id}" ${logForm.volunteerId===v.id?'selected':''}>${v.name}${v.program?` — ${v.program}`:''}</option>`).join("")}
    </optgroup>`).join("");

  $("tab-log").innerHTML=`
    <div class="card">
      <h3 style="font-family:var(--fd);font-size:19px;font-weight:600;margin-bottom:20px;">Registar sessão</h3>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label class="label">Voluntário</label>
          <select class="input input-select" id="log-vol" onchange="logForm.volunteerId=this.value">
            <option value="">Selecciona um voluntário...</option>
            ${options}
          </select>
        </div>
        <div class="form-grid">
          <div class="field"><label class="label">Data</label><input type="date" class="input" id="log-date" value="${logForm.date}" onchange="logForm.date=this.value"/></div>
          <div class="field"><label class="label">Horas</label><input type="number" class="input" id="log-hours" value="${logForm.hours}" min="0.5" max="8" step="0.5" placeholder="Ex: 1.5" onchange="logForm.hours=this.value"/></div>
        </div>
        <div class="field">
          <label class="label">Actividade</label>
          <input type="text" class="input" id="log-activity" value="${logForm.activity}" placeholder="Descreve a actividade realizada..." oninput="logForm.activity=this.value"/>
        </div>
        <div class="field">
          <label class="label">Notas (opcional)</label>
          <textarea class="input" id="log-notes" rows="3" placeholder="Observações sobre a sessão..." style="resize:vertical;" oninput="logForm.notes=this.value">${logForm.notes}</textarea>
        </div>
        <div id="log-msg"></div>
        <button class="btn btn-primary btn-full" style="padding:12px;" onclick="submitLog()">Registar sessão</button>
      </div>
    </div>`;
}

function submitLog(){
  const vid = $("log-vol").value;
  const hrs = parseFloat($("log-hours").value);
  const msg = $("log-msg");
  if(!vid){ msg.innerHTML='<div class="alert alert-error">Selecciona um voluntário.</div>'; return; }
  if(!hrs||isNaN(hrs)||hrs<=0){ msg.innerHTML='<div class="alert alert-error">Indica as horas (ex: 1.5).</div>'; return; }
  sessions.push({id:genId(),volunteerId:vid,date:$("log-date").value,hours:hrs,activity:$("log-activity").value,notes:$("log-notes").value.trim()});
  saveSess();
  logForm = {volunteerId:"",date:new Date().toISOString().split("T")[0],hours:"",activity:"",notes:""};
  msg.innerHTML='<div class="alert alert-success">Sessão registada com sucesso.</div>';
  setTimeout(()=>{msg.innerHTML='';renderLog();},2500);
}

/* ── MEMBERS TAB ── */
let membersForm = {name:"",grade:"10º Ano",program:""};
let membersGradeFilter = "";
function renderMembers(){
  const grades=["10º Ano","11º Ano","12º Ano"];
  const gradeFilterHtml = ["","10º Ano","11º Ano","12º Ano"].map(g=>`
    <button class="grade-filter-btn${membersGradeFilter===g?' active':''}" onclick="setMembersGrade('${g}')">
      ${g||"Todos"}
    </button>`).join("");

  const filt = (membersGradeFilter?volunteers.filter(v=>v.grade===membersGradeFilter):volunteers).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const listHtml = filt.length===0
    ? `<div class="card empty">Nenhum voluntário inscrito ainda.</div>`
    : filt.map(v=>{
        const vH=volHours(v.id);
        return `<div class="card" style="padding:12px 16px;">
          <div style="display:flex;align-items:center;gap:12px;">
            ${avatarHtml(v.name,38)}
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:14px;color:var(--ink);">${v.name}</div>
              <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--fm);margin-top:3px;flex-wrap:wrap;">
                <span>${v.program||"—"}</span><span>·</span>${badgeHtml(v.grade)}<span>·</span>
                <span style="color:${vH>=GOAL?'var(--forest-light)':'var(--muted)'};">${vH}h</span>
              </div>
            </div>
            <button class="del-btn" onclick="deleteVol('${v.id}')">×</button>
          </div>
        </div>`;}).join("");

  $("tab-members").innerHTML=`
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div class="card">
        <h3 style="font-family:var(--fd);font-size:19px;font-weight:600;margin-bottom:20px;">Adicionar voluntário</h3>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="field">
            <label class="label">Nome completo</label>
            <input type="text" class="input" id="mem-name" value="${membersForm.name}" placeholder="Nome do voluntário" oninput="membersForm.name=this.value"/>
          </div>
          <div class="form-grid">
            <div class="field">
              <label class="label">Ano</label>
              <div class="grade-btns">
                ${grades.map(g=>`<button class="grade-btn${membersForm.grade===g?' active':''}" onclick="setMemGrade('${g}')">${g}</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <label class="label">Programa</label>
              <input type="text" class="input" id="mem-program" value="${membersForm.program}" placeholder="Ex: Leitura Viva" oninput="membersForm.program=this.value"/>
            </div>
          </div>
          <div id="mem-err"></div>
          <button class="btn btn-primary btn-full" style="padding:11px;" onclick="addMember()">Adicionar voluntário</button>
        </div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="font-family:var(--fm);font-size:12px;color:var(--muted);">${filt.length} voluntário${filt.length!==1?'s':''}</span>
          <div class="grade-filter" style="margin:0;">${gradeFilterHtml}</div>
        </div>
        <div class="card-list">${listHtml}</div>
      </div>
    </div>`;
}

function setMemGrade(g){ membersForm.grade=g; renderMembers(); }
function setMembersGrade(g){ membersGradeFilter=g; renderMembers(); }

function addMember(){
  const name=$("mem-name").value.trim(), program=$("mem-program").value.trim();
  const err=$("mem-err");
  if(!name){err.innerHTML='<div class="alert alert-error">Indica o nome completo.</div>';return;}
  if(!program){err.innerHTML='<div class="alert alert-error">Indica o nome do programa.</div>';return;}
  volunteers.push({id:genId(),name,grade:membersForm.grade,program});
  saveVols();
  membersForm={name:"",grade:"10º Ano",program:""};
}

function deleteVol(id){
  volunteers=volunteers.filter(v=>v.id!==id);
  sessions=sessions.filter(s=>s.volunteerId!==id);
  saveVols(); saveSess();
}

/* ── VOL LOGIN ── */
function volLoginGrade(g){
  volLoginGradeFilter=g;
  document.querySelectorAll("#vol-login-grade-filter .grade-filter-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.textContent.trim()===(g||"Todos"));
  });
  renderVolSearch();
}

function renderVolSearch(){
  const q=$("vol-search").value.trim().toLowerCase();
  const res=$("vol-search-results");
  if(!q){res.innerHTML="";return;}
  const matches=volunteers.filter(v=>v.name.toLowerCase().includes(q)&&(!volLoginGradeFilter||v.grade===volLoginGradeFilter)).slice(0,6);
  if(matches.length===0){res.innerHTML='<div class="search-results"><p style="padding:16px;text-align:center;color:var(--muted);font-style:italic;font-size:13px;">Nenhum resultado</p></div>';return;}
  res.innerHTML=`<div class="search-results">${matches.map(v=>`
    <button class="search-item" onclick="showProfile('${v.id}')">
      ${avatarHtml(v.name,36)}
      <div style="flex:1;"><div style="font-weight:600;font-size:14px;color:var(--ink);">${v.name}</div><div style="font-size:12px;color:var(--muted);font-family:var(--fm);">${v.program||"—"}</div></div>
      ${badgeHtml(v.grade)}
    </button>`).join("")}
  </div>`;
}

/* ── PROFILE ── */
function showProfile(vid){
  const v=volunteers.find(x=>x.id===vid); if(!v)return;
  currentProfile=vid;
  hide("screen-vol-login");

  // Start listener for sessions
  startFirebaseListeners();

  // Wait a tick for data then render
  setTimeout(()=>renderProfile(vid),400);
  show("screen-profile");
}

function renderProfile(vid){
  const v=volunteers.find(x=>x.id===vid); if(!v)return;
  const mine=sessions.filter(s=>s.volunteerId===vid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const hours=mine.reduce((a,b)=>a+(b.hours||0),0), pct=(hours/50)*100, rem=Math.max(50-hours,0);
  const sw=10,sz=130,r=(sz-sw)/2,circ=2*Math.PI*r,dash=(Math.min(pct,100)/100)*circ;
  const strokeColor=pct>=100?"#559a28":"#2b5016";

  $("profile-top").innerHTML=`
    ${avatarHtml(v.name,52)}
    <div>
      <div class="profile-name">${v.name}</div>
      <div class="profile-badges">${badgeHtml(v.grade)}<span style="font-size:12px;color:var(--muted);font-family:var(--fm);">${v.program||"—"}</span></div>
    </div>`;

  const sessHtml=mine.length===0
    ?`<div class="card empty">Nenhuma sessão ainda.</div>`
    :mine.map(s=>`<div class="card" style="padding:14px 16px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:12px;">
          <div><div style="font-weight:600;font-size:14px;color:var(--ink);margin-bottom:2px;">${s.activity||"—"}</div>
            <div style="font-size:12px;color:var(--muted);font-family:var(--fm);">${fmtDate(s.date)}</div>
            ${s.notes?`<p style="font-size:13px;color:var(--muted);margin-top:4px;font-style:italic;">${s.notes}</p>`:""}
          </div>
          <span style="font-family:var(--fd);font-size:17px;font-weight:700;color:var(--forest);flex-shrink:0;">${s.hours}h</span>
        </div>
      </div>`).join("");

  $("profile-content").innerHTML=`
    <div class="card" style="margin-bottom:20px;padding:24px;">
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div class="progress-ring-wrap">
          <svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)">
            <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--border-light)" stroke-width="${sw}"/>
            <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="${sw}"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <span style="font-family:var(--fd);font-size:22px;font-weight:800;color:var(--forest);line-height:1;">${hours}h</span>
            <span style="font-size:9px;color:var(--muted);font-family:var(--fm);margin-top:2px;">de 50h</span>
          </div>
        </div>
        <div class="progress-info">
          ${progBar(pct)}
          <p style="margin-top:6px;font-size:12px;color:var(--muted);font-family:var(--fm);">${Math.round(Math.min(pct,100))}% da meta</p>
          <div class="prog-stats">
            <div><div class="prog-stat-num">${hours}h</div><div class="prog-stat-label">completadas</div></div>
            <div><div class="prog-stat-num" style="color:${rem===0?'#559a28':'#7a3f10'}">${rem===0?"Meta!":rem+"h"}</div><div class="prog-stat-label">${rem===0?"atingida":"em falta"}</div></div>
            <div><div class="prog-stat-num">${mine.length}</div><div class="prog-stat-label">sessões</div></div>
          </div>
        </div>
      </div>
    </div>
    <h3 style="font-family:var(--fd);font-size:18px;font-weight:600;margin-bottom:12px;color:var(--ink);">Historial de sessões</h3>
    ${sessHtml}`;
}

/* ── Init ── */
showHome();
</script>
</body>
</html>
